services:
  - type: web
    name: life-simulator-back-prod
    runtime: ruby
    branch: main
    plan: free
    region: oregon
    rootDir: back
    buildCommand: ./bin/render-build.sh
    startCommand: bundle exec puma -C config/puma.rb
    healthCheckPath: /up
    buildFilter:
      paths:
        - back/**
    envVars:
      - key: RAILS_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: RAILS_MASTER_KEY
        sync: false
      - key: WEB_CONCURRENCY
        value: "2"
      - key: RAILS_LOG_LEVEL
        value: info

  # このフロントサービスは Render Dashboard で手動管理しています。
  # この定義は設定の記録用であり、Blueprint では自動同期していません。
  - type: web
    name: mitooshi
    runtime: static
    branch: main
    rootDir: front
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    buildFilter:
      paths:
        - front/**
    routes:
      - type: rewrite
        source: /api/*
        destination: https://life-simulator-back-prod.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
